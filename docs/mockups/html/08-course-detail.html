<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Companion mockup: Course detail</title>
<!--
  Campus Companion UI mockup — Course detail
  Build target: app/course/[id].tsx
  Static reference only (no app logic). Match layout, hierarchy, spacing, colours and shapes.
  Colours map to theme tokens in docs/DESIGN.md. Data shown is the mock data in docs/DATA_MODEL.md.
  Phone frame is 390 px wide; build with flexible widths in React Native, not fixed pixels.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>

body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FAE}

html, body { margin: 0; }
body { background: #CDD3DE; display: flex; justify-content: center; padding: 32px 16px; }
.phone-frame { border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px rgba(16,24,40,0.25); }
</style>
</head>
<body>
<div class="phone-frame">
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F3F5F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; overflow: hidden">

<section style="position: relative; overflow: hidden; background: #0B6E63; color: #FFFFFF; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 0 0 28px 28px">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Courses.dc.html" aria-label="Back to courses" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 14px; font-weight: 700">Course</span>
<span style="width: 44px"></span>
</div>
<span style="align-self: flex-start; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.16); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; position: relative">CS-311 · 3 CREDIT HRS</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; max-width: 260px; position: relative">Mobile App Development</h1>
<span style="font-size: 14px; color: #D3F2EC; position: relative">Dr. Sana Iqbal · Room 210, CS Block</span>
<div style="display: flex; gap: 8px; position: relative">
<span style="padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,0.16); font-size: 12px; font-weight: 700">3 classes / wk</span>
<span style="padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,0.16); font-size: 12px; font-weight: 700">2 pending</span>
<span style="padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,0.16); font-size: 12px; font-weight: 700">Attendance 92%</span>
</div>
</section>

<main style="flex: 1; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0">
<div role="tablist" aria-label="Course sections" style="display: flex; padding: 4px; border-radius: 16px; background: #E3E7EF; gap: 4px">

<button role="tab" aria-selected="true" style="flex: 1; height: 42px; border: none; border-radius: 12px; background: #FFFFFF; color: #101828; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Classes</button>

<button role="tab" aria-selected="false" style="flex: 1; height: 42px; border: none; border-radius: 12px; background: transparent; color: #101828; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Tasks</button>

<button role="tab" aria-selected="false" style="flex: 1; height: 42px; border: none; border-radius: 12px; background: transparent; color: #101828; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">About</button>

</div>


<div style="display: flex; flex-direction: column; gap: 10px">
<a href="ClassDetail.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #101828; text-decoration: none"><span style="display: flex; flex-direction: column; align-items: center; width: 48px; padding: 8px 0; border-radius: 12px; background: #E0F4F1; color: #0B6E63"><span style="font-size: 11px; font-weight: 700">TUE</span><span style="font-size: 15px; font-weight: 700">10:00</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">Lecture</span><span style="font-size: 12px; color: #5B6475">10:00 – 11:30 · Lab 3, CS Block</span></span></a>
<a href="ClassDetail.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #101828; text-decoration: none"><span style="display: flex; flex-direction: column; align-items: center; width: 48px; padding: 8px 0; border-radius: 12px; background: #E0F4F1; color: #0B6E63"><span style="font-size: 11px; font-weight: 700">THU</span><span style="font-size: 15px; font-weight: 700">09:00</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">Lab session</span><span style="font-size: 12px; color: #5B6475">09:00 – 11:00 · Lab 3, CS Block</span></span></a>
<a href="ClassDetail.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 13px; border-radius: 18px; background: #FFFFFF; border: 2px solid #2F5BEA; color: #101828; text-decoration: none"><span style="display: flex; flex-direction: column; align-items: center; width: 48px; padding: 8px 0; border-radius: 12px; background: #2343C4; color: #FFFFFF"><span style="font-size: 11px; font-weight: 700">FRI</span><span style="font-size: 15px; font-weight: 700">10:00</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">Lecture · today</span><span style="font-size: 12px; color: #5B6475">10:00 – 11:30 · Lab 3, CS Block</span></span></a>
</div>





</main>
</div>
</div>

</html>
